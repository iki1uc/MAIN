<label for="lage">Lage:</label>
<select id="lage">
  <option value="ROOT">ROOT</option>
  <option value="PUSH">PUSH</option>
  <option value="HOLD">HOLD</option>
  <option value="UNKNOWN">UNKNOWN</option>
</select>

<button id="run">Prüfen</button>
<button id="reset">Zurücksetzen</button>

<pre id="log" aria-live="polite"></pre>

<script>
const MAIN = {
  respo: "ROOT",
  move: "origin",
  axis: "AIR",
  io: "allIN",

  exec(lage) {
    const trace = [
      { step: "EINGANG", input: { lage } }
    ];

    if (!["ROOT", "PUSH", "HOLD", "UNKNOWN"].includes(lage)) {
      return {
        status: "NEEDS_INPUT",
        reason: "Unbekannte Lage",
        trace
      };
    }

    trace.push({
      step: "PRÜFEN",
      input: { lage },
      decision: lage === "ROOT" ? "ROOT-Regel anwenden" : "ROOT-Regel nicht anwendbar"
    });

    if (lage !== "ROOT") {
      return {
        status: "INACTIVE",
        reason: `Diese Bewegung funktioniert nur bei ROOT; erhalten: ${lage}`,
        trace
      };
    }

    return {
      status: "ACTIVE",
      state: "STABLE",
      direction: "ORIGIN",
      respo: this.respo,
      io: this.io,
      axis: this.axis,
      port: { ma1: "anchor", ma2: "origin", ma3: "base" },
      reason: "Lage ist ROOT",
      trace: [...trace, { step: "ERGEBNIS", output: "STABLE / ORIGIN" }]
    };
  }
};

const lageEl = document.querySelector("#lage");
const logEl = document.querySelector("#log");

function render() {
  const result = MAIN.exec(lageEl.value);
  logEl.textContent = JSON.stringify(result, null, 2);
}

document.querySelector("#run").addEventListener("click", render);
document.querySelector("#reset").addEventListener("click", () => {
  lageEl.value = "ROOT";
  render();
});

render();
</script>
